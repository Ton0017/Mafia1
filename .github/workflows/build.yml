name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova and Pillow
      run: |
        npm install -g cordova
        pip install Pillow

    - name: Create and Build App
      run: |
        cordova create app io.github.ton0017.mafia "City of Noir"
        cd app
        cordova platform add android

        # 1. ХИРУРГИЧЕСКАЯ ЗАМЕНА ИКОНОК (полностью вручную, без cordova-res)
        python3 -c "
        import os
        from PIL import Image
        
        res = 'platforms/android/app/src/main/res'
        img = Image.open('../assets/icons/icon-512.png')

        # Стандартные размеры иконок
        sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
        for folder, size in sizes.items():
            path = os.path.join(res, folder)
            os.makedirs(path, exist_ok=True)
            resized = img.resize((size, size), Image.Resampling.LANCZOS)
            resized.save(os.path.join(path, 'ic_launcher.png'))
            resized.save(os.path.join(path, 'ic_launcher_round.png'))

        # Адаптивные иконки для Android 8+ (создаем ПРАВИЛЬНЫЕ XML)
        anydpi = os.path.join(res, 'mipmap-anydpi-v26')
        os.makedirs(anydpi, exist_ok=True)
        
        # Передний план (туз) и задний (черный)
        fg = img.resize((432, 432), Image.Resampling.LANCZOS)
        fg.save(os.path.join(res, 'mipmap-xxxhdpi', 'ic_launcher_foreground.png'))
        bg = Image.new('RGB', (432, 432), '#0a0a0a')
        bg.save(os.path.join(res, 'mipmap-xxxhdpi', 'ic_launcher_background.png'))

        xml = '''<?xml version=\"1.0\" encoding=\"utf-8\"?>
        <adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\">
            <background android:drawable=\"@mipmap/ic_launcher_background\" />
            <foreground android:drawable=\"@mipmap/ic_launcher_foreground\" />
        </adaptive-icon>'''
        
        with open(os.path.join(anydpi, 'ic_launcher.xml'), 'w') as f: f.write(xml)
        with open(os.path.join(anydpi, 'ic_launcher_round.xml'), 'w') as f: f.write(xml)

        # Черный экран загрузки
        for folder in os.listdir(res):
            if folder.startswith('drawable'):
                path = os.path.join(res, folder)
                if os.path.isdir(path):
                    Image.new('RGB', (1920, 1920), '#0a0a0a').save(os.path.join(path, 'screen.png'))
        "

        # 2. НАСТРОЙКИ СПЛЭША (отключаем стандартный)
        sed -i 's|</widget>|  <preference name="AndroidWindowSplashScreenAnimatedIcon" value="res/mipmap-xxxhdpi/ic_launcher.png" />\n  <preference name="AndroidWindowSplashScreenBackground" value="#0a0a0a" />\n  <preference name="MediaPlaybackRequiresUserGesture" value="false" />\n</widget>|' config.xml

        # 3. HTML
        cat > www/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; frame-src *; style-src * 'unsafe-inline';">
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
            <title>City of Noir</title>
            <style>
              html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0a0a; }
              iframe { border: none; width: 100%; height: 100%; }
            </style>
          </head>
          <body>
            <iframe id="game-frame" src="https://ton0017.github.io/Mafia1/" allowfullscreen></iframe>
          </body>
        </html>
        EOF

        # 4. Сборка
        cordova clean android
        cordova build android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CityOfNoir-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
