name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Build APK with Bubblewrap Docker
      uses: addnab/docker-run-action@v3
      with:
        image: ghcr.io/googlechromelabs/bubblewrap:latest
        options: -v ${{ github.workspace }}:/app -w /app
        run: |
          bubblewrap init --manifest=https://ton0017.github.io/Mafia1/manifest.json --directory=android --skipPwaValidation --yes
          bubblewrap build --skipPwaValidation
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CityOfNoir-APK
        path: android/app-release-signed.apk
