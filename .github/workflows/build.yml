name: Build APK
on: push
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Path
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

    - name: Install Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y expect
        npm install -g @bubblewrap/cli

    - name: Configure Bubblewrap
      run: |
        mkdir -p ~/.bubblewrap
        echo '{"jdkPath":"'"$JAVA_HOME"'","androidSdkPath":"/usr/local/lib/android/sdk/cmdline-tools/latest"}' > ~/.bubblewrap/config.json

    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Android,O=Android,C=US"

    - name: Init and Build APK
      env:
        BUBBLEWRAP_KEYSTORE_PASSWORD: password123
        BUBBLEWRAP_KEY_PASSWORD: password123
      run: |
        export PATH="$JAVA_HOME/bin:$PATH"
        
        echo "=== ШАГ 1: ИНИЦИАЛИЗАЦИЯ ПРОЕКТА ==="
        expect << 'EXPECT_INIT'
        set stty_init "columns 200"
        set timeout 600
        spawn bubblewrap init --manifest=https://ton0017.github.io/Mafia1/manifest.json --directory=android --skipPwaValidation
        expect {
            "install the JDK" { send "n\r"; exp_continue }
            "install the Android SDK" { send "n\r"; exp_continue }
            "Enter the path to the Android SDK" { send "$env(ANDROID_HOME)\r"; exp_continue }
            "use the default" { send "y\r"; exp_continue }
            "Is this correct" { send "y\r"; exp_continue }
            "regenerate your project" { send "y\r"; exp_continue }
            eof
        }
        EXPECT_INIT

        echo "=== ШАГ 2: СБОРКА APK ==="
        cd android
        expect << 'EXPECT_BUILD'
        set stty_init "columns 200"
        set timeout 600
        spawn bubblewrap build --skipPwaValidation --signingKeyPath=../android.keystore --signingKeyAlias=android
        expect {
            "Enter the password" { send "password123\r"; exp_continue }
            "regenerate your project" { send "n\r"; exp_continue }
            eof
        }
        EXPECT_BUILD
        
        echo "=== ПОИСК APK ==="
        find . -name "*.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CityOfNoir-APK
        path: "**/*.apk"
        if-no-files-found: error
