name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova, cordova-res, Pillow
      run: |
        npm install -g cordova cordova-res
        pip install Pillow

    - name: Create and Build App
      run: |
        cordova create app io.github.ton0017.mafia "City of Noir"
        cd app
        cordova platform add android

        # 1. Генерируем ресурсы (иконка и черный фон)
        mkdir -p resources/android
        python3 -c "
        from PIL import Image
        icon = Image.open('../assets/icons/icon-512.png')
        # Основная иконка
        icon.resize((1024, 1024), Image.Resampling.LANCZOS).save('resources/icon.png')
        # Для адаптивных иконок Android
        icon.resize((432, 432), Image.Resampling.LANCZOS).save('resources/android/icon-foreground.png')
        Image.new('RGB', (432, 432), '#0a0a0a').save('resources/android/icon-background.png')
        # Сплэш
        Image.new('RGB', (2732, 2732), '#0a0a0a').save('resources/splash.png')
        "

        # 2. Генерируем иконки
        cordova-res android --skip-config --copy

        # 3. САМОЕ ВАЖНОЕ: явно прописываем иконки в config.xml
        # Без этого Cordova затирает их своими дефолтными (роботом)
        sed -i 's|</widget>|  <platform name="android">\n    <icon background="resources/android/icon-background.png" density="mdpi" foreground="resources/android/icon-foreground.png" />\n    <icon background="resources/android/icon-background.png" density="hdpi" foreground="resources/android/icon-foreground.png" />\n    <icon background="resources/android/icon-background.png" density="xhdpi" foreground="resources/android/icon-foreground.png" />\n    <icon background="resources/android/icon-background.png" density="xxhdpi" foreground="resources/android/icon-foreground.png" />\n    <icon background="resources/android/icon-background.png" density="xxxhdpi" foreground="resources/android/icon-foreground.png" />\n    <preference name="AndroidWindowSplashScreenAnimatedIcon" value="resources/android/icon-foreground.png" />\n    <preference name="AndroidWindowSplashScreenBackground" value="#0a0a0a" />\n  </platform>\n</widget>|' config.xml

        # 4. Настройки звука
        sed -i 's|</widget>|  <preference name="MediaPlaybackRequiresUserGesture" value="false" />\n</widget>|' config.xml

        # 5. HTML
        cat > www/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; frame-src *; style-src * 'unsafe-inline';">
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
            <title>City of Noir</title>
            <style>
              html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0a0a; }
              iframe { border: none; width: 100%; height: 100%; }
            </style>
          </head>
          <body>
            <iframe id="game-frame" src="https://ton0017.github.io/Mafia1/" allowfullscreen></iframe>
          </body>
        </html>
        EOF

        # 6. Собираем с нуля
        cordova platform remove android
        cordova platform add android
        cordova build android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CityOfNoir-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
