name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova and tools
      run: |
        npm install -g cordova cordova-res
        pip install Pillow

    - name: Create Cordova App
      run: |
        cordova create app io.github.ton0017.mafia "City of Noir"
        cd app
        cordova platform add android

        mkdir -p resources
        
        # Генерируем иконку 1024x1024 и системный сплэш 2732x2732 (черный)
        python3 -c "
        from PIL import Image
        # Иконка из нашей 512
        Image.open('../assets/icons/icon-512.png').resize((1024, 1024), Image.Resampling.LANCZOS).save('resources/icon.png')
        # Системный сплэш (просто черный, чтобы не было робота)
        Image.new('RGB', (2732, 2732), '#000000').save('resources/splash.png')
        "

        # Запускаем официальный генератор (он перезапишет адаптивные иконки и сплэши)
        cordova-res android --skip-config --copy

        # Убираем задержку системного сплэша Cordova, чтобы робот не висел
        sed -i 's|<preference name="SplashScreenDelay" value="3000" />|<preference name="SplashScreenDelay" value="0" />|g' config.xml || true

        # Вставляем наш HTML со сплэшем
        cat > www/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
            <title>City of Noir</title>
            <style>
              html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0a0a; }
              iframe { border: none; width: 100%; height: 100%; }
              #splash {
                position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center;
                z-index: 10000; transition: opacity 0.4s ease;
              }
              #splash.fade { opacity: 0; }
              .splash-title {
                font-family: 'Press Start 2P', 'Courier New', monospace;
                font-size: clamp(24px, 9vw, 64px);
                line-height: 1.8;
                text-align: center;
                letter-spacing: 0.15em;
              }
              .splash-title span { display: block; }
              .splash-w { color: #ffffff; text-shadow: 0 0 14px rgba(255,255,255,0.35); }
              .splash-r { color: #a32626; text-shadow: 0 0 14px rgba(163,38,38,0.55); }
            </style>
            <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
          </head>
          <body>
            <div id="splash">
              <div class="splash-title">
                <span class="splash-w">CITY</span>
                <span class="splash-r">OF</span>
                <span class="splash-w">NOIR</span>
              </div>
            </div>
            <iframe id="game-frame" src="https://ton0017.github.io/Mafia1/" allowfullscreen></iframe>
            <script>
              const frame = document.getElementById('game-frame');
              const splash = document.getElementById('splash');
              frame.onload = () => {
                setTimeout(() => {
                  splash.classList.add('fade');
                  setTimeout(() => splash.remove(), 400);
                }, 1500);
              };
            </script>
          </body>
        </html>
        EOF

    - name: Build APK
      run: |
        cd app
        cordova build android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CityOfNoir-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
