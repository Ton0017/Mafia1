name: Build APK
on: push
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Path & Licenses
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n8933bad161af420fb4fb7fb3edec8f0b7f3cdc7d" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

    - name: Accept Licenses & Install Build Tools
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

    - name: Install Dependencies (Bubblewrap + Expect)
      run: |
        sudo apt-get update && sudo apt-get install -y expect
        npm install -g @bubblewrap/cli

    - name: Configure Bubblewrap
      run: |
        mkdir -p ~/.bubblewrap
        echo '{"jdkPath":"'"$JAVA_HOME"'","androidSdkPath":"/usr/local/lib/android/sdk/cmdline-tools/latest"}' > ~/.bubblewrap/config.json

    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Android,O=Android,C=US"

    - name: Create TWA Manifest
      run: |
        mkdir -p android
        cat > android/twa-manifest.json << 'EOF'
        {
          "packageId": "io.github.ton0017.mafia",
          "host": "ton0017.github.io",
          "name": "City of Noir",
          "launcherName": "Noir",
          "display": "fullscreen",
          "themeColor": "#000000",
          "navigationColor": "#000000",
          "backgroundColor": "#0a0a0a",
          "startUrl": "/Mafia1/",
          "iconUrl": "https://ton0017.github.io/Mafia1/assets/icons/icon-512.png",
          "maskableIconUrl": "https://ton0017.github.io/Mafia1/assets/icons/icon-512.png",
          "appVersionName": "1.0.0",
          "appVersionCode": 1,
          "shortcuts": [],
          "signingKey": {
            "path": "../android.keystore",
            "alias": "android"
          },
          "generatorApp": "bubblewrap-cli",
          "webManifestUrl": "https://ton0017.github.io/Mafia1/manifest.json",
          "fallbackType": "customtabs",
          "features": {},
          "alphaDependencies": {
            "enabled": false
          },
          "enableNotifications": false,
          "isChromeOS": false,
          "useBrowser": false
        }
        EOF

    - name: Build APK with Expect
      env:
        BUBBLEWRAP_KEYSTORE_PASSWORD: password123
        BUBBLEWRAP_KEY_PASSWORD: password123
      run: |
        export PATH="$JAVA_HOME/bin:$PATH"
        cd android
        expect << 'EXPECT_SCRIPT'
        set timeout 600
        spawn bubblewrap build --skipPwaValidation
        expect {
          "regenerate your project?" { send "y\r"; exp_continue }
          "Enter the password" { send "password123\r"; exp_continue }
          "Accept? (y/N)" { send "y\r"; exp_continue }
          "Do you accept the license" { send "y\r"; exp_continue }
          "January 16, 2019" { send "y\r"; exp_continue }
          eof
        }
        EXPECT_SCRIPT
        
        echo "=== ЧТО СОЗДАЛОСЬ В ПАПКЕ ANDROID ==="
        ls -R
        echo "=== ПОИСК APK ==="
        find . -name "*.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CityOfNoir-APK
        path: "**/*.apk"
        if-no-files-found: warn
