name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova App
      run: |
        cordova create app io.github.ton0017.mafia "City of Noir"
        cd app
        cordova platform add android

        cat > www/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
            <title>City of Noir</title>
            <style>
              html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0a0a; }
              iframe { border: none; width: 100%; height: 100%; }
            </style>
          </head>
          <body>
            <iframe src="https://ton0017.github.io/Mafia1/" allowfullscreen></iframe>
          </body>
        </html>
        EOF

    - name: Build APK
      run: |
        cd app
        cordova build android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CityOfNoir-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
