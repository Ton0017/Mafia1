name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n8933bad161af420fb4fb7fb3edec8f0b7f3cdc7d" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

    - name: Install Bubblewrap
      run: npm install -g @bubblewrap/cli

    - name: Init and Build
      run: |
        yes | bubblewrap init --manifest=https://ton0017.github.io/Mafia1/manifest.json --directory=android --skipPwaValidation
        cd android
        yes | bubblewrap build --skipPwaValidation

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CityOfNoir-APK
        path: android/app-release-signed.apk
