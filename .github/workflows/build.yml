name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova and Pillow
      run: |
        npm install -g cordova
        pip install Pillow

    - name: Create Cordova App
      run: |
        cordova create app io.github.ton0017.mafia "City of Noir"
        cd app
        cordova platform add android
        
        # 1. Подготовка платформы (создает стандартные файлы)
        cordova prepare android

        # 2. ХИРУРГИЧЕСКОЕ ВМЕШАТЕЛЬСТВО
        python3 -c "
        import os
        from PIL import Image
        
        res_path = 'platforms/android/app/src/main/res'
        
        # Удаляем адаптивные иконки Cordova (из-за них вылезает робот)
        os.system(f'rm -rf {res_path}/mipmap-anydpi-v26')
        
        # Заменяем иконки на нашего туза
        img = Image.open('../assets/icons/icon-512.png')
        sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
        for folder, size in sizes.items():
            path = f'{res_path}/{folder}'
            os.makedirs(path, exist_ok=True)
            resized = img.resize((size, size), Image.Resampling.LANCZOS)
            resized.save(f'{path}/ic_launcher.png')
            resized.save(f'{path}/ic_launcher_round.png')
        
        # Перезаписываем картинку системного сплэша (черный фон)
        for folder in os.listdir(res_path):
            if folder.startswith('drawable'):
                path = f'{res_path}/{folder}'
                if os.path.isdir(path):
                    Image.new('RGB', (1920, 1920), '#000000').save(f'{path}/screen.png')
        "

        # 3. ВШИВАЕМ СТИЛИ ДЛЯ ANDROID 12+ (чтобы убрать робота с экрана загрузки)
        mkdir -p platforms/android/app/src/main/res/values-v31
        cat > platforms/android/app/src/main/res/values-v31/styles.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                <item name="windowSplashScreenBackground">#0a0a0a</item>
                <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
                <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
            </style>
        </resources>
        EOF

        # Меняем фон в старых версиях Android
        cat > platforms/android/app/src/main/res/values/styles.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                <item name="android:background">#0a0a0a</item>
            </style>
        </resources>
        EOF

        # 4. Настройки звука и HTML
        sed -i 's|</widget>|  <preference name="MediaPlaybackRequiresUserGesture" value="false" />\n</widget>|' config.xml

        cat > www/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
            <title>City of Noir</title>
            <style>
              html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0a0a; }
              iframe { border: none; width: 100%; height: 100%; }
              #splash {
                position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center;
                z-index: 10000; transition: opacity 0.4s ease;
              }
              #splash.fade { opacity: 0; }
              .splash-title {
                font-family: 'Press Start 2P', 'Courier New', monospace;
                font-size: clamp(24px, 9vw, 64px);
                line-height: 1.8;
                text-align: center;
                letter-spacing: 0.15em;
              }
              .splash-title span { display: block; }
              .splash-w { color: #ffffff; text-shadow: 0 0 14px rgba(255,255,255,0.35); }
              .splash-r { color: #a32626; text-shadow: 0 0 14px rgba(163,38,38,0.55); }
            </style>
            <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
          </head>
          <body>
            <div id="splash">
              <div class="splash-title">
                <span class="splash-w">CITY</span>
                <span class="splash-r">OF</span>
                <span class="splash-w">NOIR</span>
              </div>
            </div>
            <iframe id="game-frame" src="https://ton0017.github.io/Mafia1/" allowfullscreen></iframe>
            <script>
              const frame = document.getElementById('game-frame');
              const splash = document.getElementById('splash');
              frame.onload = () => {
                setTimeout(() => {
                  splash.classList.add('fade');
                  setTimeout(() => splash.remove(), 400);
                }, 1500);
              };
            </script>
          </body>
        </html>
        EOF

    - name: Compile APK (Skip Prepare)
      run: |
        cd app
        # ВАЖНО: compile вместо build, чтобы не перезаписал наши иконки!
        cordova compile android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CityOfNoir-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
