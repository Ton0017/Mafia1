name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Android Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Install Bubblewrap
      run: npm install -g @bubblewrap/cli

    - name: Configure Bubblewrap
      run: |
        mkdir -p ~/.bubblewrap
        echo '{"jdkPath":"'"$JAVA_HOME"'","androidSdkPath":"'"$ANDROID_HOME"'"}' > ~/.bubblewrap/config.json

    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Android,O=Android,C=US"

    - name: Create TWA Manifest
      run: |
        mkdir -p android
        cat > android/twa-manifest.json << 'EOF'
        {
          "packageId": "io.github.ton0017.mafia",
          "host": "ton0017.github.io",
          "name": "City of Noir",
          "launcherName": "Noir",
          "display": "fullscreen",
          "themeColor": "#000000",
          "navigationColor": "#000000",
          "backgroundColor": "#0a0a0a",
          "startUrl": "/Mafia1/",
          "iconUrl": "https://ton0017.github.io/Mafia1/assets/icons/icon-512.png",
          "maskableIconUrl": "https://ton0017.github.io/Mafia1/assets/icons/icon-512.png",
          "appVersionName": "1.0.0",
          "appVersionCode": 1,
          "shortcuts": [],
          "signingKey": {
            "path": "../android.keystore",
            "alias": "android"
          },
          "generatorApp": "bubblewrap-cli",
          "webManifestUrl": "https://ton0017.github.io/Mafia1/manifest.json",
          "fallbackType": "customtabs",
          "features": {},
          "alphaDependencies": {
            "enabled": false
          },
          "enableNotifications": false,
          "isChromeOS": false,
          "useBrowser": false
        }
        EOF

    - name: Build APK
      env:
        BUBBLEWRAP_KEYSTORE_PASSWORD: password123
        BUBBLEWRAP_KEY_PASSWORD: password123
      run: |
        export PATH="$JAVA_HOME/bin:$PATH"
        cd android
        bubblewrap build --skipPwaValidation

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CityOfNoir-APK
        path: android/app-release-signed.apk
